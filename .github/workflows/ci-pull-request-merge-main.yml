name: CI (Pull Request and Merge to Main)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.repository_owner == 'centennial-oss'
    runs-on: macos-26
    env:
      APP_NAME: Consolation
      SCHEME_NAME: Consolation
      PROJECT_PATH: Consolation.xcodeproj
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Generate build info for CI
        run: |
          COMMIT="${{ github.sha }}" \
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" \
          CONFIG="Debug" \
          ARCH="arm64" \
          make generate-build-info

      # `make build` lints (including `check-no-team` and the SwiftLint self-test), runs the unit tests, and builds the
      # Debug app for macOS and the iPad simulator. Merges to main also build the unsigned Release apps.
      # An nasm install and an FFmpeg build cache arrive with the playback packages in Consolation 2.0.
      - name: Run clean, test, and build
        run: |
          make clean test ${{ github.event_name == 'pull_request' && 'build' || 'build-release-unsigned' }}
